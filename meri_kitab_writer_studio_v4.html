<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meri Kitab Writer Studio</title>
<style>
:root{--bg:#f4efe6;--panel:#fffdf8;--ink:#29243a;--accent:#6554c0;--line:#ded7e9;--soft:#eee9fb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,"Noto Sans Devanagari",sans-serif}header{position:sticky;top:0;z-index:10;background:var(--panel);border-bottom:1px solid var(--line);padding:10px;display:flex;gap:7px;align-items:center;flex-wrap:wrap}.brand{font-weight:800;margin-right:auto}.brand small{display:block;font-size:11px;font-weight:400}button,select,input{font:inherit;padding:8px;border:1px solid var(--line);border-radius:9px;background:var(--panel);color:var(--ink)}button{cursor:pointer}.primary{background:var(--accent);color:white}main{max-width:1200px;margin:auto;padding:12px;display:grid;grid-template-columns:220px minmax(0,1fr);gap:12px}aside,.work{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:12px;min-width:0}.cover{background:linear-gradient(140deg,var(--soft),var(--panel));border:1px solid var(--line);border-radius:9px;padding:12px;text-align:center;margin:8px 0;min-height:80px}.cover strong{display:block;margin:9px 0}.chapter{display:flex;gap:5px;margin:5px 0}.chapter button:first-child{flex:1;text-align:left}.thumbs{display:grid;grid-template-columns:1fr 1fr;gap:5px}.thumb{min-height:80px;font-size:10px;overflow:hidden;cursor:pointer}.toolbar{display:flex;gap:5px;flex-wrap:wrap;padding:8px 0;border-bottom:1px solid var(--line)}#title{font-size:20px;font-weight:800;width:min(100%,440px);border:0;background:transparent}.page{background:white;color:#222;max-width:760px;min-height:620px;margin:12px auto;padding:40px 45px 55px;box-shadow:0 3px 16px #0001;border:1px solid #e5e5e5;overflow-wrap:anywhere}.page img{display:block;max-width:100%;height:auto;margin:12px auto;cursor:pointer;resize:both;overflow:auto}.page img.selected{outline:2px dashed var(--accent)}.foot{float:right;color:#aaa;font-size:11px}.menu{display:none;position:fixed;z-index:20;right:12px;top:62px;width:225px;max-height:80vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px;box-shadow:0 8px 25px #0002}.menu button{display:block;width:100%;text-align:left;margin:3px 0}.muted{font-size:12px;opacity:.7}.signature{font-family:cursive;text-align:right;color:var(--accent);font-size:27px;padding:20px}@media(max-width:720px){main{grid-template-columns:1fr;padding:7px}.page{padding:24px 18px;min-height:520px}.brand{width:100%}}@media print{header,aside,.toolbar,.menu,.muted{display:none!important}main{display:block;padding:0}.work{border:0}.page{box-shadow:none;page-break-after:always}}
</style></head><body>
<header><div class="brand">📖 Meri Kitab <small>Writer Studio · अपनी किताब लिखें</small></div><button onclick="menu()">⋮ विकल्प</button><button onclick="addPage()">＋ पेज</button><button onclick="addChapter()">＋ अध्याय</button><button class="primary" onclick="downloadBook()">⬇ डाउनलोड</button><span class="muted" id="status">ऑटो-सेव चालू</span></header>
<div class="menu" id="menu"><b>किताब के विकल्प</b><button onclick="themePick()">🎨 थीम रंग चुनें</button><button onclick="viewPick()">📄 पेज व्यू बदलें</button><button onclick="limitPick()">🔢 पेज शब्द सीमा</button><button onclick="photo()">🖼 फोटो जोड़ें</button><button onclick="resizePhoto()">↔ फोटो छोटा-बड़ा</button><button onclick="movePhoto()">↕ फोटो ऊपर/नीचे</button><button onclick="covers()">📚 कवर डिज़ाइन</button><button onclick="languagePick()">🌐 भाषा चुनें</button><button onclick="signature()">✍️ हस्ताक्षर</button><button onclick="window.print()">🖨 प्रिंट / PDF</button><button onclick="menu()">बंद करें</button></div>
<main><aside><h3>📚 किताब</h3><input id="coverInput" style="width:100%" value="मेरी पहली किताब" oninput="syncTitle()" placeholder="किताब का नाम"><div class="cover"><span>FRONT COVER</span><strong id="coverTitle">मेरी पहली किताब</strong><small id="author">लेखक: आपका नाम</small></div><div class="cover"><span>BACK COVER</span><p id="back" class="muted">किताब का छोटा परिचय</p></div><button onclick="covers()">कवर बदलें</button><hr><h3>अध्याय</h3><div id="chapters"></div><button onclick="addChapter()">＋ नया अध्याय</button><hr><h3>पेज थंबनेल</h3><div id="thumbs" class="thumbs"></div></aside>
<section class="work"><input id="title" value="मेरी पहली किताब" oninput="syncTitle()"><div class="toolbar"><button onclick="cmd('bold')"><b>B</b></button><button onclick="cmd('italic')"><i>I</i></button><button onclick="cmd('underline')"><u>U</u></button><button onclick="highlight()">🖍 डार्क हाइलाइट</button><select onchange="font(this.value)"><option value="serif">किताबी फ़ॉन्ट</option><option value="cursive">स्टाइलिश फ़ॉन्ट</option><option value="sans-serif">साधारण फ़ॉन्ट</option><option value="monospace">मोनो फ़ॉन्ट</option></select><select onchange="sizeText(this.value)"><option value="3">सामान्य आकार</option><option value="4">बड़ा</option><option value="5">बहुत बड़ा</option><option value="6">शीर्षक आकार</option></select><select id="lang" onchange="save()"><option value="hi">भाषा: हिंदी</option><option value="en">Language: English</option></select><button onclick="photo()">🖼 फोटो</button><button onclick="penMenu()">🖊️ पेन</button></div><div class="toolbar" id="pen" style="display:none"><button onclick="cmd('bold')">Bold / मोटा</button><button onclick="caps()">CAPITAL</button><button onclick="sizeText(5)">बड़े शब्द</button><button onclick="font('cursive')">स्टाइलिश लेखन</button></div><p id="info" class="muted"></p><div id="pageArea"></div><div class="toolbar"><button onclick="prev()">← पिछला पेज</button><button onclick="next()">अगला पेज →</button><button onclick="signature()">✍️ हस्ताक्षर जोड़ें</button></div><p class="muted">ऑटो-सेव इसी ब्राउज़र में होता है। फोटो/ड्रॉइंग पेज की जगह लेते हैं।</p></section></main>
<script>
const $=x=>document.getElementById(x);let books=[{name:'अध्याय 1',pages:['<h2>मेरी कहानी</h2><p>यहाँ लिखना शुरू करें…</p>']}],c=0,p=0,limit=450,theme='cream',wide=false,selected=null;
function cur(){return $('pageArea').querySelector('.page')}function content(){return cur().innerHTML.replace(/<span class="foot">.*?<\/span>/,'')}function persist(){books[c].pages[p]=content()}
function save(){try{localStorage.setItem('meriKitabStudio',JSON.stringify({books,c,p,limit,theme,title:$('title').value,cover:$('coverInput').value,author:$('author').textContent,back:$('back').textContent,lang:$('lang').value}));$('status').textContent='सेव ✓'}catch(e){$('status').textContent='सेव नहीं हो पाया'}}
function render(){ $('pageArea').innerHTML='<article class="page" contenteditable="true">'+(books[c].pages[p]||'')+'<span class="foot">'+(p+1)+'</span></article>';cur().addEventListener('input',()=>{persist();info();save();thumbs()});cur().addEventListener('click',e=>{if(e.target.tagName==='IMG'){selected=e.target;document.querySelectorAll('.page img').forEach(i=>i.classList.remove('selected'));selected.classList.add('selected')}});info();chapterList();thumbs()}
function info(){let t=cur().innerText,words=(t.match(/\S+/g)||[]).length;$('info').textContent=books[c].name+' · पेज '+(p+1)+'/'+books[c].pages.length+' · शब्द '+words+'/'+limit+' · फोटो/ड्रॉइंग की जगह भी शामिल'}
function chapterList(){$('chapters').innerHTML='';books.forEach((b,i)=>{let row=document.createElement('div');row.className='chapter';let x=document.createElement('button');x.textContent=(i===c?'▶ ':'')+b.name+' ('+b.pages.length+' पेज)';x.onclick=()=>{persist();c=i;p=0;render();save()};let plus=document.createElement('button');plus.textContent='＋';plus.title='इसी अध्याय में पेज';plus.onclick=()=>{persist();c=i;p=books[i].pages.length;addPage()};row.append(x,plus);$('chapters').append(row)})}
function thumbs(){$('thumbs').innerHTML='';books.forEach((b,ci)=>b.pages.forEach((s,pi)=>{let d=document.createElement('div');d.className='cover thumb';d.textContent=s.replace(/<[^>]+>/g,' ').slice(0,70)||'खाली पेज';d.onclick=()=>{persist();c=ci;p=pi;render()};$('thumbs').append(d)}))}
function menu(){let x=$('menu');x.style.display=x.style.display==='block'?'none':'block'}function penMenu(){$('pen').style.display=$('pen').style.display==='flex'?'none':'flex'}
function addPage(){persist();books[c].pages.push('<h2>नया पेज</h2><p>यहाँ लिखें…</p>');p=books[c].pages.length-1;render();save()}function addChapter(){persist();books.push({name:'अध्याय '+(books.length+1),pages:['<h2>नया अध्याय</h2><p>यहाँ लिखें…</p>']});c=books.length-1;p=0;render();save()}
function prev(){persist();if(p)p--;else if(c){c--;p=books[c].pages.length-1}render();save()}function next(){persist();if(p<books[c].pages.length-1)p++;else{addPage();return}render();save()}
function cmd(x){document.execCommand(x,false,null);persist();save()}function highlight(){document.execCommand('hiliteColor',false,'#332b50');document.execCommand('foreColor',false,'white');persist();save()}function font(x){document.execCommand('fontName',false,x);persist();save()}function sizeText(x){document.execCommand('fontSize',false,String(x));persist();save()}function caps(){let s=window.getSelection();if(s&&!s.isCollapsed)document.execCommand('insertText',false,s.toString().toUpperCase());persist();save()}
function photo(){let i=document.createElement('input');i.type='file';i.accept='image/*';i.onchange=()=>{let f=i.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{let im=document.createElement('img');im.src=r.result;im.style.width='50%';im.alt='जोड़ी गई फोटो';cur().appendChild(im);selected=im;persist();save();info();thumbs()};r.readAsDataURL(f)};i.click()}
function resizePhoto(){if(!selected){alert('पहले पेज पर फोटो टैप करके चुनें।');return}let n=prompt('फोटो की चौड़ाई % में (10–100)',parseInt(selected.style.width)||50);if(n&&+n>=10&&+n<=100){selected.style.width=n+'%';persist();save()}}
function movePhoto(){if(!selected){alert('पहले फोटो चुनें।');return}let d=prompt('ऊपर के लिए U, नीचे के लिए D लिखें','D');if(d&&d.toUpperCase()==='U'&&selected.previousElementSibling)selected.parentNode.insertBefore(selected,selected.previousElementSibling);else if(d&&d.toUpperCase()==='D'&&selected.nextElementSibling)selected.parentNode.insertBefore(selected.nextElementSibling,selected);persist();save()}
function themePick(){let t=prompt('रंग चुनें: cream, night, mint, rose, blue','cream');let v={cream:['#f4efe6','#fffdf8','#29243a','#6554c0','#ded7e9','#eee9fb'],night:['#191824','#262433','#f4f0ff','#a99bf5','#48445c','#38314f'],mint:['#e9f5ef','#fbfffc','#203b32','#23765b','#c9e0d4','#d9efe4'],rose:['#fff0f3','#fffafb','#502b3b','#bd4167','#f0cad8','#ffe0e9'],blue:['#edf5ff','#fff','#20334c','#2866bd','#cbdcf3','#e1edff']}[t];if(v){theme=t;['--bg','--panel','--ink','--accent','--line','--soft'].forEach((k,i)=>document.documentElement.style.setProperty(k,v[i]));save()}menuClose()}
function menuClose(){$('menu').style.display='none'}function viewPick(){wide=!wide;document.querySelectorAll('.page').forEach(x=>x.style.maxWidth=wide?'100%':'760px');menuClose()}function limitPick(){let n=prompt('प्रति पेज शब्द सीमा',limit);if(n&&+n>0)limit=+n;info();save();menuClose()}
function languagePick(){let l=prompt('हिंदी के लिए hi या English के लिए en लिखें','hi');if(l==='hi'||l==='en')$('lang').value=l;save();menuClose()}
function covers(){let t=prompt('किताब का नाम',$('coverInput').value)||$('coverInput').value,a=prompt('लेखक का नाम','आपका नाम')||'आपका नाम',b=prompt('पीछे का परिचय','यह मेरी अपनी लिखी किताब है।')||'';$('title').value=t;$('coverInput').value=t;$('coverTitle').textContent=t;$('author').textContent='लेखक: '+a;$('back').textContent=b;save();menuClose()}
function syncTitle(){$('coverTitle').textContent=$('title').value;$('coverInput').value=$('title').value;save()}function signature(){let s=prompt('हस्ताक्षर लिखें','— आपका नाम');if(s){let d=document.createElement('div');d.className='signature';d.textContent=s;cur().appendChild(d);persist();save()}}
function downloadBook(){persist();let body=books.map(b=>'<section><h2>'+b.name+'</h2>'+b.pages.map((s,i)=>'<article class="page">'+s+'</article>').join('')+'</section>').join('');let doc='<!doctype html><html lang="'+$('lang').value+'"><meta charset="utf-8"><title>'+ $('title').value+'</title><style>body{font-family:serif;max-width:850px;margin:30px auto}.page{min-height:90vh;padding:30px;page-break-after:always;border-bottom:1px solid #ddd}img{max-width:100%}</style><h1>'+ $('title').value+'</h1>'+body;let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([doc],{type:'text/html;charset=utf-8'}));a.download='Meri-Kitab.html';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);save()}
try{let x=JSON.parse(localStorage.getItem('meriKitabStudio'));if(x){books=x.books||books;c=Math.min(x.c||0,(x.books||books).length-1);p=Math.min(x.p||0,books[c].pages.length-1);limit=x.limit||450;theme=x.theme||'cream';$('title').value=x.title||'मेरी पहली किताब';$('coverInput').value=x.cover||$('title').value;$('coverTitle').textContent=$('title').value;$('author').textContent=x.author||'लेखक: आपका नाम';$('back').textContent=x.back||'किताब का छोटा परिचय';if(x.lang)$('lang').value=x.lang}}catch(e){}render();save();
</script></body></html>
